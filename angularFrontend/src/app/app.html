<div class="main-container">
  <div class="main-layout">
    <app-header [links]="[
    { label: 'Home', fragment: 'home' },
    { label: 'Services', fragment: 'services' },
    { label: 'Memberships', fragment: 'pricing' },
  ]"></app-header>

    <router-outlet />

    <app-footer></app-footer>

</div>

  <app-mobile-warning-modal
    (dismiss)="onWarningDismissed()"

  </app-mobile-warning-modal>
}
