<div class="hamburger" [class.menu-open]="isHamburgerExpanded">
  <div class="button-wrapper">
    <button
      type="button"
      class="hamburger-btn"
      [class.open]="isHamburgerExpanded"
      aria-label="Menu"
      [attr.aria-expanded]="isHamburgerExpanded"
      aria-controls="main-menu"
      (click)="toggleHamburger()"
    >
      <span class="bar" aria-hidden="true"></span>
      <span class="bar" aria-hidden="true"></span>
      <span class="bar" aria-hidden="true"></span>
    </button>
  </div>

  <div class="overlay" [class.open]="isHamburgerExpanded">
    <ul class="nav-links" id="main-menu">
      @for (link of links(); track link.label) {
        <li (click)="goToLinkAndCloseMenu()">
          @if (link.path) {
            <a [routerLink]="link.path">{{ link.label }}</a>
          } @else {
            <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
          }
        </li>
      }
    </ul>
  </div>
</div>
