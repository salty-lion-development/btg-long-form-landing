<div class="hamburger" [class.overlay-menu]="isHamburgerExpanded">
  <div class="button-wrapper">
    <button
      type="button"
      class="hamburger-btn"
      aria-label="Menu"
      aria-expanded="false"
      aria-controls="main-menu"
      (click)="toggleHamburger()"
    >
      <span class="bar" aria-hidden="true"></span>
      <span class="bar" aria-hidden="true"></span>
      <span class="bar" aria-hidden="true"></span>
    </button>
  </div>


  @if(isHamburgerExpanded) {
    <ul class="nav-links">
      @for (link of links(); track link.label) {
        <li (click)="goToLinkAndCloseMenu()">
          @if (link.path) {
            <a routerLink="link.path">{{ link.label }}</a>
          } @else {
            <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
          }
        </li>
      }
    </ul>
  }
</div>
