<div class="challenge-result-card" [style.backgroundColor]="backgroundColor">
    <div class="challenge-result-grid">
        <div class="media-section">
            @if (isVideo) {
                <app-embedded-vid [videoId]="mediaSource"></app-embedded-vid>
            }
            @else {
                <img class="challenge-result-image" [src]="mediaSource">
            }
        </div>

        <div class="a">
            <img class="challenge-result-icon" [src]="iconSrc">
        </div>

        <div class="b">
            <div class="vertical-line"></div>
        </div>

        <div class="c">
            <img class="challenge-result-icon" [src]="iconSrc">
        </div>

        <div class="d">
            <div class="vertical-line"></div>
        </div>

        <div class="e">
            <h3 class="title">{{ challengeTitle }}</h3>
        </div>

        <div class="f">
            <p>
                {{ challengeContent }}
            </p>
        </div>

        <div class="g">
            <h3 class="title">{{ resultTitle }}</h3>
        </div>

        <div class="h">
            <h3>
                {{ resultContent }}
            </h3>
        </div>

        <div class="i">
            <p>
                {{ testimonial }}

                <br>
                <br>

                <span style="font-weight: bold;">- {{ customerName }}</span>
            </p>

        </div>
    </div>
</div>
