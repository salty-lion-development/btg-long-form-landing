<div>
  <img [src]="pillarData.iconSrc" />
</div>

<div>
  <h2>{{ pillarData.title }}</h2>

  <p [innerHTML]="pillarData.body"></p>
</div>

<div class="media-container">
  @if (isVideo) {
    <app-gif-player [videoSrc]="pillarData.mediaSrc"></app-gif-player>
  }
  @else {
    <img [class]="{clearPath: isClearPath}" [src]="pillarData.mediaSrc" />
  }
</div>
