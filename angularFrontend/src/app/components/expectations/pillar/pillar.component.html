<div class="pillar-icon">
  <img [src]="pillarData.iconSrc" />
</div>

<div class="pillar-text">
  <h2>{{ pillarData.title }}</h2>

  <p [innerHTML]="pillarData.body"></p>
</div>

<div class="media-container">
  @if (isVideo) {
    <app-gif-player [videoSrc]="pillarData.mediaSrc"></app-gif-player>
  }
  @else {
    <img [class.conversationZoom]="isConversation" [class.clearPath]="isClearPath" [class.community]="isCommunity" [src]="pillarData.mediaSrc" />
  }
</div>
