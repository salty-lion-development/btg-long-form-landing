<nav>
  <div>
    <img class="logo" src="images/btg-icon-and-name-logo.png">

    <ul class="nav-links">
      @for (link of links(); track link.label) {
        <li>
          @if (link.path) {
            <a routerLink="link.path">{{ link.label }}</a>
          } @else {
            <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
          }
        </li>
      }
    </ul>

    <button routerLink="/" fragment="pricing">Start Speaking Today!</button>
  </div>
</nav>
