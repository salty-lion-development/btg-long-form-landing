<div [attr.data-most-popular]="isMostPopular()" class="membership-container">
  <div class="most-popular-label">
    Most popular
  </div>

  <div class="membership-content">
      <div class="card-body">
      <span class="name">{{name()}}</span>
      <span class="price">${{yearlyPrice()}} / yr. (${{monthlyPrice()}}/ mo.)</span>


      <div class="membership-card-content">
        @for (feature of features(); track $index) {
          <img src="images/check-mark-swoop.png" />
          <span>{{feature}}</span>
        }
      </div>
    </div>

    <app-cta-button [buttonText]="'Pick Plan'" [buttonHeight]="'2.5rem'" [target]="target()"></app-cta-button>
  </div>
</div>
